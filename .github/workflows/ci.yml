name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ar
          POSTGRES_PASSWORD: ar
          POSTGRES_DB: ar
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ar" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.1", enable-cache: true }
      - uses: pnpm/action-setup@v6
        with: { version: "10.15.0", run_install: false }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --group dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy backend services
      - run: docker compose up -d minio
      - run: curl --fail --retry 20 --retry-delay 2 http://127.0.0.1:9000/minio/health/live
      - run: uv run pytest tests/unit tests/contract tests/integration
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: uv run alembic downgrade base && uv run alembic upgrade head
